name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # lets the job push screenshots to the ci-screenshots branch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and screenshot walkthrough
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # The walkthrough test renders every screen of the real app. Keep the latest set on a
      # throwaway branch so it can be looked at without downloading a build artifact.
      - name: Publish screenshots to the ci-screenshots branch
        if: always() && github.event_name == 'push'
        run: |
          src=app/build/outputs/roborazzi
          if [ ! -d "$src" ] || [ -z "$(ls -A "$src" 2>/dev/null)" ]; then
            echo "No screenshots were produced."
            exit 0
          fi
          out="$(mktemp -d)"
          cp -r "$src"/. "$out"/
          cd "$out"
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-screenshots

      - name: Assemble release APK (R8, signed with the sideload key)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # The release build is the one to install: compiled and optimised, it runs several times
      # faster than the debug build. Both are signed with the same key, so either installs over
      # the other and keeps its data.
      - name: Name the APKs
        run: |
          mkdir -p out/release out/debug
          cp app/build/outputs/apk/release/*.apk out/release/hudson.apk
          cp app/build/outputs/apk/debug/*.apk out/debug/hudson-debug.apk

      # Without the profile the phone cannot compile the app ahead of time, and it runs slower.
      - name: Check the APK carries its compile profile
        run: |
          unzip -l out/release/hudson.apk | grep -E "assets/dexopt/baseline.prof" || { echo "No baseline profile in the release APK"; exit 1; }
          ls -la out/release/hudson.apk

      - name: Upload the APK to install
        uses: actions/upload-artifact@v4
        with:
          name: hudson-apk
          path: out/release/hudson.apk
          if-no-files-found: error

      - name: Upload the debug APK (slow; for troubleshooting only)
        uses: actions/upload-artifact@v4
        with:
          name: hudson-debug-apk
          path: out/debug/hudson-debug.apk
          if-no-files-found: error

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests
          if-no-files-found: ignore
